_version = 1

# Issue -> spec -> human approval -> code -> checks -> independent review -> draft PR.
#
# Started by its Fabro automation (schedule or the Run button in the web UI) or:
#   fabro run .fabro/workflows/issue-to-pr/workflow.toml [-I issue=<number>]
#
# The graph in workflow.fabro is the same in every repository that uses this
# pipeline. Everything specific to this repository is set below.
# No secrets belong in this file. Keys and tokens live in Fabro's vault.

[workflow]
graph = "workflow.fabro"

[run.inputs]
# Issue number to work on. "0" lets the run pick the oldest open issue that
# carries approval_label and not in_progress_label. Automations cannot pass
# inputs, so they always get "0".
issue = "0"
# Label a maintainer adds to release an issue to the pipeline.
approval_label = "fabro-approved"
# Label the run adds to the issue it accepts. While any open issue carries
# it, automation runs pick no other issue: one build at a time. The last step
# of the run replaces it with built_label or failed_label. If a run was
# killed and the label stayed behind, remove it by hand.
in_progress_label = "fabro-in-progress"
# How the run ended. Automation runs skip issues carrying either; remove the
# label to have the issue built again.
built_label = "fabro-built"
failed_label = "fabro-failed"
# GitHub logins allowed to release an issue (comma separated, no spaces).
maintainers = "RiieCco,blabla1337,JorgeCarvalhoPT"

# Retry budgets. When a budget is used up the run pauses and asks a human.
max_cheap_fixes = "2"
max_fix_attempts = "4"
max_review_rounds = "3"

# Review depth. A change gets the cheaper reviewer only if it is at most this
# many changed lines, the spec says "Risk level: low", and it touches none of
# the sensitive paths (substrings of changed non-test paths).
max_light_review_lines = "40"
sensitive_paths = "scripts/,validate_skills.py,migrate_api.py,.claude-plugin,pentester,construct/"
# Directory that holds the tests, or "none". Python code changes must come
# with a change under it unless the spec says "Tests required: no".
tests_dir = "none"

# --- This repository --------------------------------------------------------
repo_owner = "0x0pointer"
repo_name = "skills"
# Shown to every agent as: the <owner>/<name> repository (<description>).
repo_description = "a library of agent skills: one directory per skill holding a SKILL.md (YAML frontmatter plus instructions) and its reference files, with a few small maintenance scripts. Skills are instructions that security-testing agents follow, so a change of wording is a change of behaviour"
# Extra rule appended to the list of paths agents may not touch.
repo_rules = "Skills are changed here, in this repository. agent-smith and Construct include it as a git submodule and pick changes up through their own update pull requests, so there is nothing to change in those repositories."
# Shell commands. install_command also runs as the first step of every run.
# lint_command may be "none".
install_command = "pip install -q pyyaml"
lint_command = "none"
test_command = "python3 validate_skills.py"
# Told to the agents: what can and cannot be run in the sandbox.
test_notes = "This repository has no unit tests. The check that runs here is python3 validate_skills.py, which validates the frontmatter of every SKILL.md. CI also runs a SkillSpector scan of the changed skills, which cannot run in this sandbox."
# Paths a run may never change (comma separated, no spaces): prefixes and
# exact file names. The verify step rejects the run if one of them changed.
protected_prefixes = ".github/,.fabro/,.env"
protected_files = "LICENSE"

# Default model for any stage the stylesheet in workflow.fabro does not cover.
[run.model]
name = "gpt-5.4"

[run.environment]
id = "skills"

[environments.skills]
provider = "docker"

[environments.skills.image]
# Built from .fabro/docker/Dockerfile
docker = "skills-fabro:latest"

[environments.skills.resources]
cpu = 1
memory = "1000MB"

[run.pull_request]
enabled = true
draft = true

[run.integrations.github.permissions]
issues = "write"
contents = "write"
pull_requests = "write"
