name: Notify agent-smith

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger bump-skills in agent-smith
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SMITH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/0x0pointer/agent-smith/dispatches \
            -d '{"event_type":"skills-updated"}'
