name: Scan skills (SkillSpector)

on:
  push:
    paths:
      - "**/SKILL.md"
      - ".github/workflows/scan-skills.yml"
  pull_request:
    paths:
      - "**/SKILL.md"
      - ".github/workflows/scan-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # Resolve SkillSpector once so the per-skill loop reuses the cached env.
      - name: Warm SkillSpector cache
        run: uvx --from git+https://github.com/NVIDIA/skillspector.git skillspector --help

      - name: Scan every skill
        run: |
          set -uo pipefail
          mkdir -p reports
          fail=0

          rows=""
          details=""

          # One directory per SKILL.md, sorted and de-duplicated.
          while IFS= read -r skill; do
            name=$(basename "$skill")
            out="reports/${name}.json"
            md="reports/${name}.md"

            # --no-llm = static-only (no API key needed). To enable the LLM
            # stage, drop --no-llm and set SKILLSPECTOR_PROVIDER + the matching
            # API key env below (see the commented `env:` block).
            uvx --from git+https://github.com/NVIDIA/skillspector.git \
              skillspector scan "$skill" --no-llm --format json --output "$out" || true
            # Second pass: human-readable findings (the "why") for the summary.
            uvx --from git+https://github.com/NVIDIA/skillspector.git \
              skillspector scan "$skill" --no-llm --format markdown --output "$md" || true

            score=$(jq -r '.risk_assessment.score // "?"' "$out" 2>/dev/null || echo "?")
            sev=$(jq -r '.risk_assessment.severity // "ERROR"' "$out" 2>/dev/null || echo "ERROR")
            rec=$(jq -r '.risk_assessment.recommendation // "ERROR"' "$out" 2>/dev/null || echo "ERROR")
            count=$(jq -r '.issues | length' "$out" 2>/dev/null || echo "?")

            rows="${rows}| \`$name\` | $score | $sev | $rec | $count |"$'\n'

            # Expand the full findings for anything not clean.
            if [ "$rec" != "SAFE" ]; then
              details="${details}<details><summary><strong>$name</strong> — $rec ($sev, score $score, $count issues)</summary>"$'\n\n'
              details="${details}$(cat "$md" 2>/dev/null || echo '_no report produced_')"$'\n\n'
              details="${details}</details>"$'\n\n'
            fi

            # Non-blocking for now: warn on DO_NOT_INSTALL instead of failing the
            # job, so the first run surfaces every skill's score. Flip this back to
            # `fail=1` / `exit $fail` once a baseline suppresses intended payloads.
            if [ "$rec" = "DO_NOT_INSTALL" ]; then
              echo "::warning title=SkillSpector::$name flagged as DO_NOT_INSTALL (score $score, $count issues) — see job summary for details"
            fi
          done < <(find . -name SKILL.md -not -path './.git/*' -printf '%h\n' | sort -u)

          {
            echo "## SkillSpector results"
            echo ""
            echo "| Skill | Score | Severity | Recommendation | Issues |"
            echo "|-------|------:|----------|----------------|-------:|"
            printf '%s' "$rows"
            echo ""
            echo "### Why these were flagged"
            echo ""
            printf '%s' "$details"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
        # Uncomment to enable the LLM semantic stage (and remove --no-llm above):
        # env:
        #   SKILLSPECTOR_PROVIDER: anthropic
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: reports/
