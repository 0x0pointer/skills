name: Scan skills (SkillSpector)

on:
  push:
    branches:
      - main
    paths:
      - "**/SKILL.md"
      - ".github/workflows/scan-skills.yml"
  pull_request:
    paths:
      - "**/SKILL.md"
      - ".github/workflows/scan-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan skills
        run: |
          pip install uv
          for skill in $(find . -name SKILL.md -not -path './.git/*' -printf '%h\n' | sort -u); do
            echo "::group::$skill"
            uvx --from git+https://github.com/NVIDIA/skillspector.git \
              skillspector scan "$skill" --no-llm; rc=$?
            echo "::endgroup::"
            # Warn-only: never fail the job. Exit 1 = DO_NOT_INSTALL, >=2 = scan error.
            if [ "$rc" -eq 1 ]; then
              echo "::warning title=SkillSpector::$skill flagged DO_NOT_INSTALL — see its group above"
            elif [ "$rc" -ge 2 ]; then
              echo "::warning title=SkillSpector::$skill scan errored (exit $rc)"
            fi
          done
          exit 0
