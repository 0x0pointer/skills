name: Scan skills (SkillSpector)

on:
  push:
    branches:
      - main
    paths:
      - "**/SKILL.md"
      - ".github/workflows/scan-skills.yml"
  pull_request:
    paths:
      - "**/SKILL.md"
      - ".github/workflows/scan-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skillspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan skills
        run: |
          pip install uv
          {
            echo "## SkillSpector results"
            echo ""
            echo "| Skill | Failed |"
            echo "|-------|:------:|"
          } >> "$GITHUB_STEP_SUMMARY"

          for skill in $(find . -name SKILL.md -not -path './.git/*' -printf '%h\n' | sort -u); do
            name=$(basename "$skill")
            # Scan once; capture output so the verdict can go in the group title.
            out=$(uvx --from git+https://github.com/NVIDIA/skillspector.git \
              skillspector scan "$skill" --no-llm 2>&1); rc=$?

            # Warn-only: exit 1 = DO_NOT_INSTALL, >=2 = scan error, 0 = ok.
            case "$rc" in
              0) icon="✅"; failed="no" ;;
              1) icon="❌"; failed="yes" ;;
              *) icon="⚠️"; failed="error" ;;
            esac

            # Collapsible per-skill log with the verdict in the (collapsed) title.
            echo "::group::$icon $name — failed: $failed"
            echo "$out"
            echo "::endgroup::"

            echo "| \`$name\` | $icon $failed |" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -ne 0 ] && echo "::warning title=SkillSpector::$name failed: $failed (exit $rc)"
          done

          exit 0
